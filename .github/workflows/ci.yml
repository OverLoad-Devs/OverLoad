name: CI

on:
  push:
    branches: [main, dev, 'setup/**']
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app
        run: |
          xcodebuild build \
            -project OverLoad.xcodeproj \
            -scheme OverLoad \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Select an iPhone simulator
        id: simulator
        run: |
          xcrun simctl list devices available -j | python3 -c '
          import json, os, sys
          devices = json.load(sys.stdin)["devices"]
          phone = next(d for runtime, entries in devices.items() if ".iOS-" in runtime for d in entries if d["name"].startswith("iPhone"))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("id=" + phone["udid"] + "\n")
          '

      - name: Run Swift Testing suite
        run: |
          xcodebuild test \
            -project OverLoad.xcodeproj \
            -scheme OverLoad \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO
